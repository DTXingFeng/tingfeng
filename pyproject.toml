[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tingfengbot"
version = "1.0.0"
description = "一个基于 NoneBot2 和 OneBot V11 协议的深度智能化聊天机器人"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["chatbot", "nonebot", "qq", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "annotated-types>=0.7.0,<0.8.0",
    "anyio>=4.12.0,<5.0.0",
    "certifi>=2026.1.0,<2027.0.0",
    "chromadb>=0.5.3,<1.0.0",
    "colorama>=0.4.6,<0.5.0",
    "distro>=1.9.0,<2.0.0",
    "exceptiongroup>=1.3.0,<2.0.0",
    "h11>=0.16.0,<1.0.0",
    "httpcore>=1.0.9,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "idna>=3.11.0,<4.0.0",
    "jiter>=0.12.0,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "msgpack>=1.1.0,<2.0.0",
    "multidict>=6.7.0,<7.0.0",
    "numpy>=1.24.0,<2.0.0",
    "nonebot-adapter-onebot>=2.4.0,<3.0.0",
    "nonebot2>=2.4.0,<3.0.0",
    "openai>=2.15.0,<3.0.0",
    "pillow>=12.1.0,<14.0.0",
    "propcache>=0.4.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-core>=2.18.0,<3.0.0",
    "pygtrie>=2.5.0,<3.0.0",
    "python-dotenv>=1.2.0,<2.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "sniffio>=1.3.0,<2.0.0",
    "tqdm>=4.67.0,<5.0.0",
    "typing-extensions>=4.15.0,<5.0.0",
    "typing-inspection>=0.4.2,<1.0.0",
    "websockets>=16.0.0,<17.0.0",
    "yarl>=1.22.0,<2.0.0",
    "tiktoken>=0.12.0,<1.0.0",
    "regex>=2026.1.0,<2027.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/tingfengbot"
Repository = "https://github.com/yourusername/tingfengbot.git"
Documentation = "https://tingfengbot.readthedocs.io/"
"Bug Tracker" = "https://github.com/yourusername/tingfengbot/issues"

[project.scripts]
tingfengbot = "bot:main"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*.egg-info",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused-import

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
]

[[tool.mypy.overrides]]
module = [
    "nonebot.*",
    "chromadb.*",
    "loguru.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
