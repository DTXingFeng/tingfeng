version: '3.8'

services:
  tingfengbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tingfengbot
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # 持久化数据
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./stickers:/app/stickers
    environment:
      # 时区设置
      - TZ=${TZ:-Asia/Shanghai}
      
      # NoneBot 配置
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8080}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SUPERUSERS=${SUPERUSERS:-[]}
      - COMMAND_START=${COMMAND_START:-["", "/"]}
      - COMMAND_SEP=${COMMAND_SEP:-["."]}
      
      # OneBot V11 连接配置
      - ONEBOT_WS_URL=${ONEBOT_WS_URL}
      - ONEBOT_ACCESS_TOKEN=${ONEBOT_ACCESS_TOKEN}
      
      # OpenAI API 配置
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-120}
      
      # 数据库配置
      - DB_PATH=${DB_PATH:-/app/data/tingfengbot.db}
      - CHROMA_DB_PATH=${CHROMA_DB_PATH:-/app/data/chroma}
      
      # 日志配置
      - LOG_DIR=${LOG_DIR:-/app/logs}
      - LOG_ROTATION=${LOG_ROTATION:-10 MB}
      - LOG_RETENTION=${LOG_RETENTION:-30 days}
      
      # 性能配置
      - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-10}
      - MAX_CONSOLIDATION_CONCURRENT=${MAX_CONSOLIDATION_CONCURRENT:-3}
      - MESSAGE_RATE_LIMIT=${MESSAGE_RATE_LIMIT:-50}
      - MESSAGE_RATE_WINDOW=${MESSAGE_RATE_WINDOW:-10}
      
      # 安全配置
      - ENABLE_INPUT_VALIDATION=${ENABLE_INPUT_VALIDATION:-true}
      - ENABLE_RATE_LIMITING=${ENABLE_RATE_LIMITING:-true}
      - MAX_MESSAGE_LENGTH=${MAX_MESSAGE_LENGTH:-5000}
      
      # 机器人配置
      - BOT_NAME=${BOT_NAME:-听风}
      - BOT_ROLE=${BOT_ROLE:-AI助手}
      - INITIAL_MOOD=${INITIAL_MOOD:-0.5}
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8080)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 网络配置
    networks:
      - tingfengbot-network

networks:
  tingfengbot-network:
    driver: bridge

volumes:
  tingfengbot-data:
    driver: local
