version: '3.8'

services:
  tingfengbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tingfengbot
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
      - ./ai_config.yaml:/app/ai_config.yaml
      - ./stickers:/app/stickers
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DRIVER=~websockets
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8080}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ONEBOT_WS_URLS=${ONEBOT_WS_URLS}
      - ONEBOT_ACCESS_TOKEN=${ONEBOT_ACCESS_TOKEN:-}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8080)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tingfengbot-network

networks:
  tingfengbot-network:
    driver: bridge
